name: ci

on:
  push:
  pull_request:

jobs:
  public-shell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm install
      - run: npm test
      - name: Confirm private cores were not checked out
        run: test ! -e src/core && test ! -e observer && test ! -e moon.mod.json

