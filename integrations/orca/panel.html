<!doctype html><html><head><meta charset="utf-8"><style>body{margin:0;padding:14px;font:13px system-ui;color:var(--foreground,#ddd);background:var(--background,transparent)}label,select,input,button{display:block;width:100%;margin:8px 0}input,select,button{box-sizing:border-box;padding:7px;border:1px solid var(--border,#555);border-radius:6px;color:inherit;background:var(--secondary,#222)}.status{white-space:pre-wrap;color:var(--muted-foreground,#999)}</style></head><body><h1>Ayatsumugi</h1><p>Inspect React DOM and state locally in the selected Orca terminal.</p><label>Source<select id="source"><option value="ayatori">Ayatori / React DOM</option><option value="tsumugi">Tsumugi / State</option></select></label><label>Absolute input path<input id="input" placeholder="/absolute/path/to/trace.jsonl"></label><label>Terminal<select id="terminal"></select></label><button id="refresh">Refresh terminals</button><button id="run">Run inspector</button><p class="status" id="status"></p><script>'use strict';let seq=0;const pending={};const status=document.querySelector('#status');function call(action,params){return new Promise(resolve=>{const requestId='aya-'+(++seq);pending[requestId]=resolve;parent.postMessage({type:'orca-panel-action',requestId,action,params},'*')})}addEventListener('message',event=>{const data=event.data;if(data?.type!=='orca-panel-action-result'||!pending[data.requestId])return;pending[data.requestId](data);delete pending[data.requestId]});async function refresh(){const result=await call('workspace.readContext',{});const select=document.querySelector('#terminal');select.innerHTML='';for(const terminal of result.value?.terminals||[]){const option=document.createElement('option');option.value=terminal.id;option.textContent=terminal.id;select.append(option)}status.textContent=select.options.length?'Ready':'No terminal in the focused worktree'}function shellQuote(value){return "'"+value.replaceAll("'","'\\\"'\\\"'")+"'"}document.querySelector('#refresh').onclick=refresh;document.querySelector('#run').onclick=async()=>{const input=document.querySelector('#input').value.trim();if(!input){status.textContent='Enter an absolute input path';return}const source=document.querySelector('#source').value;const terminalId=document.querySelector('#terminal').value;const text=`npx --yes @noobknotsdev/ayatsumugi-terminal snapshot --source ${source} --input ${shellQuote(input)}`;const result=await call('terminal.sendText',{terminalId,text,enter:true});status.textContent=result.ok?'Inspector started in terminal':'Failed: '+(result.error||result.errorCode)};refresh()</script></body></html>
